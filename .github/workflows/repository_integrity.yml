name: Repository integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_manifests.py --check
      - run: python scripts/restore_assets.py
      - run: python hardware/kv260/verify_package.py
      - run: python -m unittest discover -s tests -v
      - name: Require a clean checkout after verification
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
