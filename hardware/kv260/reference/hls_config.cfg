# Vitis Unified HLS flow (Vitis 2025.2: there is no vitis_hls executable; use v++ / vitis-run), run from hls/:
#   1. vitis-run --mode hls --csim    --config hls_config.cfg --work_dir moe_hls_work   (C simulation, bit-exact check; ~10 min)
#   2. v++ -c --mode hls              --config hls_config.cfg --work_dir moe_hls_work   (synthesis; 10-20 min, do NOT interrupt)
#   3. vitis-run --mode hls --package --config hls_config.cfg --work_dir moe_hls_work   (IP -> moe_hls_work/hls/impl/ip)
# report: moe_hls_work/hls/syn/report/moe_top_csynth.rpt ; register map: moe_hls_work/hls/impl/ip/drivers/moe_top_v1_0/src/xmoe_top_hw.h
part=xck26-sfvc784-2LV-c

[hls]
flow_target=vivado
package.output.format=ip_catalog
package.output.syn=false
syn.top=moe_top
syn.file=src/moe_top.cpp
syn.file_cflags=src/moe_top.cpp,-Isrc -std=c++14 -DN_REPL=8
tb.file=tb/tb_moe.cpp
tb.file_cflags=tb/tb_moe.cpp,-Isrc -std=c++14 -DN_REPL=8
tb.file=../vectors
csim.argv=vectors syn_narrowband_0 syn_pulse_0 edge_silence
csim.clean=true
csim.O=true
clock=10.0
clock_uncertainty=1.0
syn.compile.pipeline_loops=0
syn.rtl.reset=control
