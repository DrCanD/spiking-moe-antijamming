# D6 (router tail: feature finalisation + Random Forest) — Vitis unified HLS flow, run from hls/ (env from settings64.bat):
#   vitis-run --mode hls --csim    --config hls_config.cfg --work_dir rf_hls_work     (~1 min; must print "-> PASS")
#   v++ -c --mode hls              --config hls_config.cfg --work_dir rf_hls_work     (~2-4 min)
#   vitis-run --mode hls --package --config hls_config.cfg --work_dir rf_hls_work     (IP -> rf_hls_work/hls/impl/ip)
# report: rf_hls_work/hls/syn/report/rf_top_csynth.rpt ; register map: rf_hls_work/hls/impl/ip/drivers/rf_top_v1_0/src/xrf_top_hw.h
part=xck26-sfvc784-2LV-c

[hls]
flow_target=vivado
package.output.format=ip_catalog
package.output.syn=false
syn.top=rf_top
syn.file=src/rf_top.cpp
syn.file_cflags=src/rf_top.cpp,-Isrc -std=c++14 -DN_REPL_RF=1
tb.file=tb/tb_rf.cpp
tb.file_cflags=tb/tb_rf.cpp,-Isrc -std=c++14 -DN_REPL_RF=1
tb.file=tb/rf_tests.bin
csim.argv=rf_tests.bin
csim.clean=true
csim.O=true
clock=10.0
clock_uncertainty=1.0
syn.rtl.reset=control
syn.compile.pipeline_loops=0

